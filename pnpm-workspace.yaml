# The only npm package this repository still builds is the `surrealql-analyzer`
# CLI shim, which `scripts/release.sh publish` ships with `pnpm -r publish`.
# It lives outside a `packages/` directory, and leaving it off this list is how
# it once sat at 0.1.0 while everything else was released — so it stays listed
# even though it is now the sole member.
#
# The TypeScript client SDKs that used to fill `packages/` have left this
# repository; `linkWorkspacePackages` went with them, because nothing here
# depends on a sibling any more.
packages:
  - "npm/*"
