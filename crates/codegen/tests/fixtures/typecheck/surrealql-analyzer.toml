# The fixture for `crates/codegen/tests/generation.rs`: the smallest workspace
# that exercises every value convention the generated TypeScript names. It must
# analyze free of error findings, and every embedded query in `src/queries.ts`
# must reach the rendered registry. It used to be held against a golden that
# `tsc` compiled inside the client package; that package has left, and so has
# the golden.

[sources]
schema = ["schema/**/*.surql"]
queries = ["queries/**/*.surql"]
ignore = ["node_modules/**", "dist/**"]
