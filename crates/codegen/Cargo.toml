[package]
name = "surrealql-analyzer-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "TypeScript type generation from SurrealQL Analyzer analysis results"

[dependencies]
# The types document is a serializable artifact: `serde` is what makes it one,
# and `Kind` and the schema index already derive through it upstream.
serde = { version = "1.0", features = ["derive"] }
surrealdb-types.workspace = true
surrealql-analyzer-workspace = { path = "../workspace", version = "0.5.3" }

[dev-dependencies]
# `tests/golden.rs` runs the CLI's generation path over a fixture workspace:
# host-file extraction is the embed crate (also used to assert the
# host-parameter prefix restated here still matches its definition), and the
# schema/query partition follows the same globs `surrealql-analyzer.toml` declares.
glob = "0.3"
serde_json = "1.0"
surrealql-analyzer-diagnostics = { path = "../diagnostics", version = "0.5.3" }
surrealql-analyzer-embed = { path = "../embed", version = "0.5.3" }
surrealql-analyzer-syntax = { path = "../syntax", version = "0.5.3" }

[lints]
workspace = true
